<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Divine Blessing Temple</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080500;color:#fff;font-family:Georgia,"Times New Roman",serif}
#app{position:fixed;inset:0;background:#080500}
video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(.82) contrast(1.05) brightness(.72)}
.overlay{position:absolute;inset:0;background:
radial-gradient(circle at 50% 35%,rgba(255,186,65,.10),transparent 35%),
linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.60))}
#temple{position:absolute;inset:0;pointer-events:none;opacity:.9}
#temple:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
width:min(90vw,650px);height:100%;background:
linear-gradient(90deg,transparent 0 8%,rgba(197,139,39,.12) 8% 10%,transparent 10% 90%,rgba(197,139,39,.12) 90% 92%,transparent 92%);
border-left:2px solid rgba(255,205,100,.22);border-right:2px solid rgba(255,205,100,.22)}
#bell{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-size:52px;opacity:.78;text-shadow:0 0 25px #f5bd57;transition:.3s}
#bell.ring{animation:bellSwing .9s ease}
@keyframes bellSwing{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-10deg)}50%{transform:translateX(-50%) rotate(10deg)}75%{transform:translateX(-50%) rotate(-6deg)}}
#status{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:90%;text-align:center}
#hint{font-size:18px;letter-spacing:1px;text-shadow:0 2px 8px #000;transition:.4s}
#blessing{display:none;font-size:clamp(26px,6vw,48px);line-height:1.25;color:#ffe7ad;text-shadow:0 0 20px rgba(255,181,52,.7),0 3px 8px #000;animation:appear 1.2s ease}
#small{margin-top:14px;font:13px Arial,sans-serif;opacity:.65}
#start{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(67,39,8,.95),rgba(3,2,0,.98))}
.card{text-align:center;width:min(90%,500px);padding:32px 22px;border:1px solid rgba(255,207,112,.35);border-radius:22px;background:rgba(25,13,2,.78);box-shadow:0 0 60px rgba(255,164,39,.12)}
.card h1{font-size:32px;margin:0 0 10px;color:#ffe1a0}.card p{line-height:1.6;color:#dbc9a8}
button{border:0;border-radius:999px;padding:15px 28px;font-size:17px;background:#d49a36;color:#160d02;font-weight:bold;box-shadow:0 5px 25px rgba(212,154,54,.3)}
@keyframes appear{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:none}}
.flash{animation:flash .9s ease}
@keyframes flash{0%{background:rgba(255,202,86,0)}35%{background:rgba(255,202,86,.18)}100%{background:rgba(255,202,86,0)}}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay muted playsinline></video>
  <div class="overlay" id="overlay"></div>
  <div id="temple"></div>
  <div id="bell">🔔</div>
  <div id="status">
    <div id="hint">ಕ್ಯಾಮೆರಾ ಮುಂದೆ 3 ಸೆಕೆಂಡುಗಳು ನಿಂತಿರಿ</div>
    <div id="blessing"></div>
    <div id="small">Camera remains on • ದಿವ್ಯ ಆಶೀರ್ವಾದವನ್ನು ಸ್ವೀಕರಿಸಿ</div>
  </div>
  <div id="start">
    <div class="card">
      <h1>🛕 ಶ್ರೀ ಗಣೇಶ ದಿವ್ಯ ಆಶೀರ್ವಾದ</h1>
      <p>ಗಣೇಶನ ಮುಂದೆ ನಿಂತಿರಿ. ನೀವು ಸುಮಾರು 3 ಸೆಕೆಂಡುಗಳು ಕ್ಯಾಮೆರಾ ಮುಂದೆ ಇದ್ದರೆ, ಗಂಟೆಯ ನಾದದೊಂದಿಗೆ ನಿಧಾನವಾದ ದಿವ್ಯ ಆಶೀರ್ವಾದದ ವಾಣಿ ಕೇಳಿಸುತ್ತದೆ.</p>
      <button id="begin">ದೇವಾಲಯ ಪ್ರವೇಶಿಸಿ</button>
      <div style="margin-top:14px;font:12px Arial;color:#a99578">Camera permission is required.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const video=document.getElementById('video');
const start=document.getElementById('start');
const begin=document.getElementById('begin');
const hint=document.getElementById('hint');
const blessing=document.getElementById('blessing');
const overlay=document.getElementById('overlay');

const blessings=[
"ನನ್ನ ಮಗು… ನೀನು ಮಾಡಿದ ಎಲ್ಲಾ ಒಳ್ಳೆಯ ಕಾರ್ಯಗಳಿಗೆ ನನ್ನ ಆಶೀರ್ವಾದ ಸದಾ ನಿನ್ನೊಂದಿಗಿರಲಿ. ನಿನ್ನ ಜೀವನದಲ್ಲಿ ಸುಖ, ಶಾಂತಿ ಮತ್ತು ಸಮೃದ್ಧಿ ತುಂಬಿರಲಿ.",
"ನೀನು ಮಾಡಿದ ಸತ್ಕರ್ಮಗಳು ನಿನಗೆ ಸದಾ ಶುಭ ಫಲವನ್ನು ತರಲಿ. ಧೈರ್ಯದಿಂದ ಮುಂದೆ ಸಾಗು. ನನ್ನ ಆಶೀರ್ವಾದ ಯಾವಾಗಲೂ ನಿನ್ನೊಂದಿಗಿದೆ.",
"ಭಕ್ತಿಯಿಂದ ತಲೆಬಾಗು… ಧೈರ್ಯದಿಂದ ಎದ್ದು ನಿಲ್ಲು. ನಿನ್ನ ಪ್ರತಿಯೊಂದು ಹೆಜ್ಜೆಯಲ್ಲೂ ನನ್ನ ಕೃಪೆ ಮತ್ತು ಆಶೀರ್ವಾದ ಇರಲಿ.",
"ನಿನ್ನ ಮನಸ್ಸಿನಲ್ಲಿರುವ ಒಳ್ಳೆಯತನ ನಿನಗೆ ಅನೇಕ ಪಟ್ಟು ಮರಳಿ ಬರಲಿ. ನಿನಗೂ ನಿನ್ನ ಕುಟುಂಬಕ್ಕೂ ಸದಾ ಸಂತೋಷ ಮತ್ತು ಸಮೃದ್ಧಿ ಇರಲಿ.",
"ನಿನ್ನ ಭಕ್ತಿಯನ್ನು ನಾನು ಸ್ವೀಕರಿಸಿದ್ದೇನೆ. ಭಯಪಡಬೇಡ… ಒಳ್ಳೆಯ ದಾರಿಯಲ್ಲಿ ನಡೆ. ನನ್ನ ಆಶೀರ್ವಾದ ಸದಾ ನಿನ್ನನ್ನು ಕಾಪಾಡಲಿ."
];

let triggered=false, bowedSince=0, lastTrigger=0, cameraStream=null, voiceReady=false;

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  // Deep, slow, warm delivery. The actual timbre comes from the Kannada
  // TTS voice installed/available on the visitor's Android device.
  u.rate=.52; u.pitch=.34; u.volume=1;
  const voices=speechSynthesis.getVoices();
  const preferred =
    voices.find(v=>/^kn[-_]/i.test(v.lang)) ||
    voices.find(v=>/Kannada/i.test(v.name)) ||
    voices.find(v=>/en-IN/i.test(v.lang));
  if(preferred) u.voice=preferred;
  speechSynthesis.speak(u);
}

let audioCtx=null;
function audioContext(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null;
  if(!audioCtx) audioCtx=new C();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

function ring(){
  const c=audioContext();
  const bell=document.getElementById('bell');
  bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring');
  if(!c) return;
  const now=c.currentTime;
  // Layered temple-bell tones with a long decay.
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(.18/(i*.25+1),now+.025);
    g.gain.exponentialRampToValueAtTime(.0001,now+3.2);
    o.connect(g); g.connect(c.destination); o.start(now); o.stop(now+3.3);
  });
}

function divineDrone(){
  const c=audioContext();
  if(!c) return;
  const now=c.currentTime;
  [130.81,196,261.63].forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,now);
    g.gain.linearRampToValueAtTime(.018/(i+1),now+1.2);
    g.gain.linearRampToValueAtTime(.0001,now+7.5);
    o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+7.6);
  });
}

function triggerBlessing(){
  if(triggered || Date.now()-lastTrigger<5000) return;
  triggered=true;lastTrigger=Date.now();
  const text=blessings[Math.floor(Math.random()*blessings.length)];
  hint.style.display='none'; blessing.textContent=text; blessing.style.display='block';
  overlay.classList.add('flash'); ring(); divineDrone();
  setTimeout(()=>speak(text),1600);
  setTimeout(()=>{blessing.style.display='none';hint.style.display='block';hint.textContent='ಶ್ರೀ ಗಣೇಶನ ಆಶೀರ್ವಾದ ಸದಾ ನಿಮ್ಮೊಂದಿಗಿರಲಿ';overlay.classList.remove('flash')},10500);
  setTimeout(()=>{triggered=false;hint.textContent='ಕ್ಯಾಮೆರಾ ಮುಂದೆ 3 ಸೆಕೆಂಡುಗಳು ನಿಂತಿರಿ'},10500);
}

const pose=new Pose({
  locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});
pose.setOptions({
  modelComplexity:1,
  smoothLandmarks:true,
  enableSegmentation:false,
  minDetectionConfidence:.50,
  minTrackingConfidence:.50
});

let personSince=0;
let personPresent=false;
let personLeftSince=0;

function personIsPresent(results){
  const lm=results.poseLandmarks;
  if(!lm) return false;

  // Use several upper-body landmarks so a partial/full person can still trigger.
  const ids=[0,11,12,23,24];
  const visible=ids.filter(i=>lm[i] && (lm[i].visibility ?? 0)>.35).length;

  // Require at least a few reliable landmarks and a person reasonably in frame.
  if(visible<3) return false;

  const shoulders = lm[11] && lm[12];
  if(shoulders){
    const cx=(lm[11].x+lm[12].x)/2;
    if(cx<.05 || cx>.95) return false;
  }
  return true;
}

pose.onResults(results=>{
  const present=personIsPresent(results);

  if(present){
    personLeftSince=0;
    if(!personPresent){
      personPresent=true;
      personSince=performance.now();
    }

    // Trigger exactly after the person has continuously remained in view
    // for about 3 seconds. triggerBlessing() itself prevents duplicates.
    if(!triggered && performance.now()-personSince>=3000){
      triggerBlessing();
    }
  }else{
    if(personPresent){
      if(!personLeftSince) personLeftSince=performance.now();
      // Consider the person gone after a short tracking gap.
      if(performance.now()-personLeftSince>1200){
        personPresent=false;
        personSince=0;
        personLeftSince=0;
      }
    }else{
      personSince=0;
    }
  }
});

async function startCamera(){
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=cameraStream;
  await video.play();
  const cam=new Camera(video,{onFrame:async()=>{await pose.send({image:video})},width:1280,height:720});
  cam.start();
}
begin.onclick=async()=>{
  try{
    await startCamera();
    start.style.display='none';
    if('speechSynthesis' in window) speechSynthesis.getVoices();
  }catch(e){
    alert('ಕ್ಯಾಮೆರಾ ಆರಂಭವಾಗಲಿಲ್ಲ. Camera permission ನೀಡಿ ಮತ್ತು ಈ ವೆಬ್‌ಸೈಟ್ ಅನ್ನು HTTPS ಮೂಲಕ ತೆರೆಯಿರಿ.');
  }
};
</script>
</body>
</html>
